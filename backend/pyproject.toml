[project]
name = "carecompass-backend"
version = "0.1.0"
description = "CareCompass care-navigation and caregiver-matching API (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "langgraph>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# An application, not a distributable library: install dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
